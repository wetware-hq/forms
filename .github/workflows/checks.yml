name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: tests (wording hash, ids, rules)
        run: python3 -m pytest -q
      - name: rulecheck
        run: python3 scripts/rulecheck.py
      - name: prepush (CI mode, no signed file)
        run: python3 scripts/prepush.py --ci
